name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf cmake libclang-dev
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo test --workspace
      - run: npm --prefix ui test

  package:
    name: package (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
            bundle_glob: target/aarch64-apple-darwin/release/bundle
          - name: windows-x64
            os: windows-latest
            args: ""
            target: ""
            bundle_glob: target/release/bundle
          - name: linux-x64
            os: ubuntu-22.04
            args: ""
            target: ""
            bundle_glob: target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf cmake libclang-dev
      - name: Windows toolchain for whisper.cpp (cmake + libclang)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Build bundles
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
      - name: List bundles
        shell: bash
        run: find ${{ matrix.bundle_glob }} -maxdepth 3 | sort
      - name: Zip macOS .app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd ${{ matrix.bundle_glob }}/macos
          ditto -c -k --sequesterRsrc --keepParent Timeline.app Timeline-macos-arm64.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: timeline-${{ matrix.name }}
          path: |
            ${{ matrix.bundle_glob }}/dmg/*.dmg
            ${{ matrix.bundle_glob }}/macos/*.app.zip
            ${{ matrix.bundle_glob }}/msi/*.msi
            ${{ matrix.bundle_glob }}/nsis/*.exe
            ${{ matrix.bundle_glob }}/appimage/*.AppImage
            ${{ matrix.bundle_glob }}/deb/*.deb
            ${{ matrix.bundle_glob }}/rpm/*.rpm
          if-no-files-found: error
