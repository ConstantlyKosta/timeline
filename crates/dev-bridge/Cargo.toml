[package]
name = "dev-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Serves the real timeline-core over HTTP so the UI can be driven in a plain browser (Playwright, `npm run dev`). Not shipped in the app."

[lib]
name = "dev_bridge"
path = "src/lib.rs"

[[bin]]
name = "dev-bridge"
path = "src/main.rs"

[dependencies]
timeline-core = { path = "../timeline-core" }
timeline-asr = { path = "../timeline-asr" }
tiny_http = "0.12"
serde_json = { version = "1", features = ["float_roundtrip"] }
percent-encoding = "2"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
tempfile = "3"
